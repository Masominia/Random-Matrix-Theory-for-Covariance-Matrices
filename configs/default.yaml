# Data: 1,455 Nasdaq stocks, daily, 2018-2023 (skfolio datasets).

seed: 20260101
methods: [sample, linear shrinkage, clipping, RIE, cross-validated]
cv_folds: 5
holding_days: 21             # rebalance monthly, hold out of sample
configs:                     # N assets, T days of history, number of random universes
  - {N: 100, T: 500, universes: 2}
  - {N: 200, T: 500, universes: 2}
  - {N: 300, T: 500, universes: 2}
  - {N: 450, T: 500, universes: 3}
  - {N: 300, T: 250, universes: 2}
  - {N: 750, T: 500, universes: 1, skip: [cross-validated]}
headline: {N: 450, T: 500}

theory:
  noise: {N: 400, T: 1000}
  planted: {N: 300, T: 600, replications: 5}
